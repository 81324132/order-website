                    <div class="text-4xl mb-4">📝</div>
                    <h3 class="text-xl font-bold mb-2">论文写作</h3>
                    <p class="text-gray-600">本科专科全覆盖，专业一对一</p>
                </div>
                <div class="bg-white p-6 rounded-lg shadow-md">

                <div class="bg-white p-6 rounded-lg shadow-md">

    <!-- 价格表 -->
    <section id="prices" class="py-16 bg-white">
        <div class="container mx-auto px-4">
            <h2 class="text-3xl font-bold text-center mb-12 text-gray-800">💰 透明价格表</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-6 max-w-6xl mx-auto">

                    <p class="text-gray-600 mb-6">每篇（不分字数）</p>

                    </a>

                <!-- 本科非学位 -->
                <div class="border-2 border-gray-800 rounded-lg p-6 text-center">
                    <h3 class="text-xl font-bold mb-4">本科非学位</h3>
                    <div class="text-3xl font-bold text-red-500 mb-2">¥30</div>
                    <p class="text-gray-600 mb-6">每千字</p>

                <!-- 本科学位 -->
                <div class="border-2 border-gray-800 rounded-lg p-6 text-center relative">
                    <div class="absolute -top-3 right-4 bg-yellow-400 text-gray-800 font-bold px-3 py-1 rounded-full text-sm">
                        热门
                    </div>
                    <h3 class="text-xl font-bold mb-4">本科学位</h3>
                    <div class="text-3xl font-bold text-red-500 mb-2">¥35</div>
                    <p class="text-gray-600 mb-6">每千字</p>
                    <ul class="text-left mb-6 space-y-2">
                        <li>✓ 毕业/毕业设计</li>
                        <li>✓ 知网查重</li>
                        <li>✓ 无限次修改</li>
                        <li>✓ 5-10天交付</li>
                    </ul>
                    <a href="#order" class="block w-full bg-teal-500 text-white py-2 rounded-lg hover:bg-teal-600">
                        立即下单
                    </a>
                </div>

                <!-- 实践报告 -->
                <div class="border-2 border-gray-800 rounded-lg p-6 text-center">
                    <h3 class="text-xl font-bold mb-4">实践/实习报告</h3>
                    <div class="text-3xl font-bold text-red-500 mb-2">¥20</div>
                    <p class="text-gray-600 mb-6">每千字</p>
                    <ul class="text-left mb-6 space-y-2">
                        <li>✓ 实习/社会实践</li>
                        <li>✓ 调研/总结报告</li>
                        <li>✓ 免费修改</li>
                        <li>✓ 1-3天交付</li>
                    </ul>
                    <a href="#order" class="block w-full bg-red-500 text-white py-2 rounded-lg hover:bg-red-600">
                        立即下单
                    </a>
                </div>

                <!-- 网课考试 -->
                <div class="border-2 border-gray-800 rounded-lg p-6 text-center">
                    <h3 class="text-xl font-bold mb-4">网课考试</h3>
                    <div class="text-3xl font-bold text-red-500 mb-2">¥4</div>
                    <p class="text-gray-600 mb-6">每门课</p>
                    <ul class="text-left mb-6 space-y-2">
                        <li>✓ 视频+作业+考试</li>
                        <li>✓ 90分以上保障</li>
                        <li>✓ 全程托管</li>
                        <li>✓ 人脸考试另议</li>
                    </ul>
                    <a href="#order" class="block w-full bg-red-500 text-white py-2 rounded-lg hover:bg-red-600">

            <p class="text-center mt-8 text-gray-600">

            </p>

    <!-- 下单表单 -->
    <section id="order" class="py-16 bg-gray-100">
        <div class="container mx-auto px-4">
            <h2 class="text-3xl font-bold text-center mb-12 text-gray-800">📋 填写下单信息</h2>
            
            <div class="max-w-2xl mx-auto bg-white p-8 rounded-lg shadow-md border-2 border-gray-800">
                <form id="orderForm">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                        <div>
                            <label class="block font-bold mb-2" for="school">所在学校 *</label>
                            <input type="text" id="school" name="学校" required 
                                class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-red-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block font-bold mb-2" for="major">专业 *</label>
                            <input type="text" id="major" name="专业" required 
                                class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-red-500 focus:outline-none">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                        <div>
                            <label class="block font-bold mb-2" for="name">姓名 *</label>
                            <input type="text" id="name" name="姓名" required 
                                class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-red-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block font-bold mb-2" for="service">服务类型 *</label>
                            <select id="service" name="服务类型" required 
                                class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-red-500 focus:outline-none">
                                <option value="">请选择</option>
                                <option value="专科论文">专科论文</option>
                                <option value="本科非学位论文">本科非学位论文</option>
                                <option value="本科学位论文">本科学位论文</option>
                                <option value="实践/实习报告">实践/实习报告</option>
                                <option value="网课考试">网课考试</option>
                                <option value="其他">其他服务</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-6">
                        <label class="block font-bold mb-2" for="count">字数/数量要求 *</label>
                        <input type="text" id="count" name="字数/数量要求" placeholder="例如：5000字 / 3门网课" required 
                            class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-red-500 focus:outline-none">
                    </div>

                    <div class="mb-6">
                        <label class="block font-bold mb-2" for="requirements">其他要求</label>
                        <textarea id="requirements" name="其他要求" rows="4" 
                            placeholder="请详细描述您的需求，包括题目、截止日期、格式要求等..."
                            class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-red-500 focus:outline-none"></textarea>
                    </div>

                    <div class="mb-6">
                        <label class="block font-bold mb-2" for="contact">联系方式 *</label>
                        <input type="text" id="contact" name="联系方式" placeholder="微信/QQ/手机号" required 
                            class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-red-500 focus:outline-none">
                    </div>

                    <button type="submit" id="submitBtn"
                        class="w-full bg-teal-500 text-white text-xl font-bold py-3 rounded-lg hover:bg-teal-600 transition-colors">
                        提交订单
                    </button>
                </form>

                <!-- 提交成功提示 -->
                <div id="successMessage" class="hidden mt-8 bg-green-100 border-2 border-green-500 rounded-lg p-6 text-center">
                    <div class="text-4xl mb-4">✅</div>
                    <h3 class="text-2xl font-bold text-green-700 mb-2">订单提交成功！</h3>
                    <p class="text-green-600">我们会在24小时内联系您，请保持联系方式畅通。</p>
                </div>
            </div>
        </div>
    </section>

    <!-- 联系我们 -->
    <section id="contact" class="py-16 bg-white">
        <div class="container mx-auto px-4 text-center">
            <h2 class="text-3xl font-bold mb-8 text-gray-800">📞 联系我们</h2>
            <p class="text-xl mb-6 text-gray-600">如有任何问题，欢迎随时联系我们</p>
            <div class="flex flex-col md:flex-row justify-center items-center space-y-4 md:space-y-0 md:space-x-12 text-xl">
                <div class="flex items-center">
                    <i class="fa fa-weixin text-green-500 mr-2 text-2xl"></i>
                    <span>微信：z2236548922</span>
                </div>
                <div class="flex items-center">
                    <i class="fa fa-qq text-blue-500 mr-2 text-2xl"></i>
                    <span>QQ：1060342146</span>
                </div>
            </div>
        </div>
    </section>

    <!-- 页脚 -->
    <footer class="bg-gray-800 text-white py-6">
        <div class="container mx-auto px-4 text-center">
            <p>© 2026 优学教育工作室 版权所有</p>
        </div>
    </footer>

    <script>
        // 音乐控制
        const bgMusic = document.getElementById('bgMusic');
        const musicToggle = document.getElementById('musicToggle');
        let isPlaying = true;

        // 解决浏览器自动播放限制
        document.addEventListener('click', () => {
            if (bgMusic.paused) {
                bgMusic.play().catch(e => console.log('点击音乐按钮开启'));
            }
        }, { once: true });

        musicToggle.addEventListener('click', () => {
            if (isPlaying) {
                bgMusic.pause();
                musicToggle.innerHTML = '<i class="fa fa-volume-off"></i>';
            } else {
                bgMusic.play();
                musicToggle.innerHTML = '<i class="fa fa-volume-up"></i>';
            }
            isPlaying = !isPlaying;
        });

        // 平滑滚动
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                document.querySelector(this.getAttribute('href')).scrollIntoView({
                    behavior: 'smooth'
                });
            });
        });

        // 表单提交（已配置好你的金山文档Webhook）
        const orderForm = document.getElementById('orderForm');
        const submitBtn = document.getElementById('submitBtn');
        const successMessage = document.getElementById('successMessage');
        const WPS_WEBHOOK = 'https://www.kdocs.cn/chatflow/api/v2/func/webhook/3ELO5T8ClACpg17UfZJHYIb3qF3';

        orderForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = '提交中...';

            try {
                const formData = new FormData(orderForm);
                const data = Object.fromEntries(formData.entries());

                const response = await fetch(WPS_WEBHOOK, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    orderForm.classList.add('hidden');
                    successMessage.classList.remove('hidden');
                } else {
                    throw new Error('提交失败');
                }
            } catch (error) {
                alert('订单提交失败，请稍后重试或直接联系我们！');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '提交订单';
            }
        });
    </script>
</body>
</html>
