<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>优学教育 - 专业论文网课服务平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FF6B6B',
                        secondary: '#4ECDC4',
                        accent: '#FFE66D',
                        dark: '#2C3E50'
                    },
                    fontFamily: {
                        comic: ['Comic Sans MS', 'cursive', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .text-shadow {
                text-shadow: 3px 3px 0px rgba(0,0,0,0.2);
            }
            .comic-border {
                border: 4px solid #000;
                box-shadow: 8px 8px 0px #000;
            }
            .comic-button {
                border: 3px solid #000;
                box-shadow: 5px 5px 0px #000;
                transition: all 0.2s ease;
            }
            .comic-button:hover {
                transform: translate(-2px, -2px);
                box-shadow: 7px 7px 0px #000;
            }
            .comic-button:active {
                transform: translate(2px, 2px);
                box-shadow: 3px 3px 0px #000;
            }
            .speech-bubble {
                position: relative;
                background: #fff;
                border: 3px solid #000;
                border-radius: 20px;
            }
            .speech-bubble:after {
                content: '';
                position: absolute;
                bottom: 0;
                left: 20%;
                width: 0;
                height: 0;
                border: 20px solid transparent;
                border-top-color: #000;
                border-bottom: 0;
                margin-bottom: -20px;
                margin-left: -10px;
            }
            .speech-bubble:before {
                content: '';
                position: absolute;
                bottom: 0;
                left: 20%;
                width: 0;
                height: 0;
                border: 17px solid transparent;
                border-top-color: #fff;
                border-bottom: 0;
                margin-bottom: -14px;
                margin-left: -7px;
                z-index: 1;
            }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-pink-100 to-blue-100 min-h-screen font-comic">
    <!-- 背景音乐 -->
    <audio id="bgMusic" loop autoplay>
        <source src="background-music.mp3" type="audio/mpeg">
    

    <!-- 音乐控制按钮 -->
    <button id="musicToggle" class="fixed bottom-6 right-6 z-50 bg-white comic-button rounded-full w-14 h-14 flex items-center justify-center text-2xl text-primary">
        <i class="fa fa-volume-up"></i>
    </button>

    <!-- 导航栏 -->
    <nav class="bg-white/80 backdrop-blur-sm sticky top-0 z-40 border-b-4 border-black">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="text-2xl font-bold text-primary">🎓 优学教育</div>
            <div class="hidden md:flex space-x-6">
                <a href="#home" class="text-dark hover:text-primary transition-colors">首页</a>
                <a href="#order" class="text-dark hover:text-primary transition-colors">立即下单</a>
                <a href="#contact" class="text-dark hover:text-primary transition-colors">联系我们</a>
            </div>
        </div>
    </nav>

    <!-- 漫画风格英雄区 -->
    <section id="home" class="relative py-20 md:py-32 overflow-hidden">
        <div class="absolute inset-0 z-0">
            <div class="absolute top-10 left-10 w-20 h-20 bg-accent rounded-full opacity-70 animate-pulse"></div>
            <div class="absolute top-40 right-20 w-32 h-32 bg-secondary rounded-full opacity-50 animate-bounce"></div>
            <div class="absolute bottom-20 left-1/4 w-16 h-16 bg-primary rounded-full opacity-60 animate-pulse"></div>
            <div class="absolute bottom-40 right-1/3 w-24 h-24 bg-accent rounded-full opacity-40 animate-bounce"></div>
        </div>

        <div class="container mx-auto px-4 relative z-10">
            <div class="max-w-4xl mx-auto text-center">
                <div class="speech-bubble inline-block mb-8 px-8 py-4">
                    <h1 class="text-4xl md:text-6xl font-bold text-dark text-shadow">
                        专业论文网课服务
                    </h1>
                </div>
                
                <p class="text-xl md:text-2xl mb-12 text-dark/80">
                    一站式解决你的学业烦恼，让学习更轻松！
                </p>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-12">
                    <div class="bg-white comic-border rounded-lg p-6">
                        <div class="text-5xl mb-4">📝</div>
                        <h3 class="text-xl font-bold mb-2">论文写作</h3>
                        <p class="text-dark/70">本科专科全覆盖，专业团队一对一</p>
                    </div>
                    <div class="bg-white comic-border rounded-lg p-6">
                        <div class="text-5xl mb-4">💻</div>
                        <h3 class="text-xl font-bold mb-2">网课代修</h3>
                        <p class="text-dark/70">全程托管，高分保障</p>
                    </div>
                    <div class="bg-white comic-border rounded-lg p-6">
                        <div class="text-5xl mb-4">✅</div>
                        <h3 class="text-xl font-bold mb-2">售后无忧</h3>
                        <p class="text-dark/70">免费修改，满意为止</p>
                    </div>
                </div>

                <a href="#order" class="inline-block bg-primary text-white text-xl font-bold py-4 px-12 rounded-lg comic-button">
                    立即下单 →
                </a>
            </div>
        </div>
    </section>

    <!-- 下单表单区 -->
    <section id="order" class="py-20 bg-white">
        <div class="container mx-auto px-4">
            <div class="max-w-3xl mx-auto">
                <h2 class="text-3xl md:text-4xl font-bold text-center mb-12 text-dark text-shadow">
                    📋 填写下单信息
                </h2>

                <form id="orderForm" class="bg-gray-50 comic-border rounded-lg p-8 space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-dark font-bold mb-2" for="school">
                                所在学校 <span class="text-primary">*</span>
                            </label>
                            <input type="text" id="school" name="学校" required 
                                class="w-full px-4 py-3 border-3 border-black rounded-lg focus:outline-none focus:ring-2 focus:ring-primary">
                        </div>
                        <div>
                            <label class="block text-dark font-bold mb-2" for="major">
                                专业 <span class="text-primary">*</span>
                            </label>
                            <input type="text" id="major" name="专业" required 
                                class="w-full px-4 py-3 border-3 border-black rounded-lg focus:outline-none focus:ring-2 focus:ring-primary">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-dark font-bold mb-2" for="name">
                                姓名 <span class="text-primary">*</span>
                            </label>
                            <input type="text" id="name" name="姓名" required 
                                class="w-full px-4 py-3 border-3 border-black rounded-lg focus:outline-none focus:ring-2 focus:ring-primary">
                        </div>
                        <div>
                            <label class="block text-dark font-bold mb-2" for="level">
                                学历层次 <span class="text-primary">*</span>
                            </label>
                            <select id="level" name="学历层次" required 
                                class="w-full px-4 py-3 border-3 border-black rounded-lg focus:outline-none focus:ring-2 focus:ring-primary">
                                <option value="">请选择</option>
                                <option value="专科">专科</option>
                                <option value="本科">本科</option>
                                <option value="硕士">硕士</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-dark font-bold mb-2" for="wordcount">
                            字数要求 <span class="text-primary">*</span>
                        </label>
                        <input type="text" id="wordcount" name="字数要求" placeholder="例如：5000字" required 
                            class="w-full px-4 py-3 border-3 border-black rounded-lg focus:outline-none focus:ring-2 focus:ring-primary">
                    </div>

                    <div>
                        <label class="block text-dark font-bold mb-2" for="requirements">
                            其他要求
                        </label>
                        <textarea id="requirements" name="其他要求" rows="5" placeholder="请详细描述您的需求，包括题目、截止日期、格式要求等..."
                            class="w-full px-4 py-3 border-3 border-black rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"></textarea>
                    </div>

                    <div>
                        <label class="block text-dark font-bold mb-2" for="contact">
                            联系方式 <span class="text-primary">*</span>
                        </label>
                        <input type="text" id="contact" name="联系方式" placeholder="微信/QQ/手机号" required 
                            class="w-full px-4 py-3 border-3 border-black rounded-lg focus:outline-none focus:ring-2 focus:ring-primary">
                    </div>

                    <button type="submit" id="submitBtn"
                        class="w-full bg-secondary text-white text-xl font-bold py-4 px-8 rounded-lg comic-button">
                        提交订单
                    </button>
                </form>

                <!-- 提交成功提示 -->
                <div id="successMessage" class="hidden mt-8 bg-green-100 border-3 border-green-500 rounded-lg p-6 text-center">
                    <div class="text-4xl mb-4">✅</div>
                    <h3 class="text-2xl font-bold text-green-700 mb-2">订单提交成功！</h3>
                    <p class="text-green-600">我们会在24小时内联系您，请保持联系方式畅通。</p>
                </div>
            </div>
        </div>
    </section>

    <!-- 联系我们 -->
    <section id="contact" class="py-20 bg-gradient-to-br from-secondary/20 to-primary/20">
        <div class="container mx-auto px-4 text-center">
            <h2 class="text-3xl md:text-4xl font-bold mb-8 text-dark text-shadow">
                📞 联系我们
            </h2>
            <p class="text-xl mb-6 text-dark/80">
                如有任何问题，欢迎随时联系我们
            </p>
            <div class="flex flex-col md:flex-row justify-center items-center space-y-4 md:space-y-0 md:space-x-8 text-2xl">
                <a href="#" class="text-dark hover:text-primary transition-colors">
                    <i class="fa fa-weixin"></i> 微信：z2236548922
                </a>
                <a href="#" class="text-dark hover:text-primary transition-colors">
                    <i class="fa fa-qq"></i> QQ：1060342146
                </a>
            </div>
        </div>
    </section>

    <!-- 页脚 -->
    <footer class="bg-dark text-white py-6 border-t-4 border-black">
        <div class="container mx-auto px-4 text-center">
            <p>© 2026 优学教育工作室 版权所有</p>
        </div>
    </footer>

    <script>
        // 音乐控制
        const bgMusic = document.getElementById('bgMusic');
        const musicToggle = document.getElementById('musicToggle');
        let isPlaying = true;

        // 自动播放处理（解决浏览器自动播放限制）
        document.addEventListener('click', () => {
            if (bgMusic.paused) {
                bgMusic.play().catch(e => console.log('自动播放被阻止，请点击音乐按钮开启'));
            }
        }, { once: true });

        musicToggle.addEventListener('click', () => {
            if (isPlaying) {
                bgMusic.pause();
                musicToggle.innerHTML = '<i class="fa fa-volume-off"></i>';
            } else {
                bgMusic.play();
                musicToggle.innerHTML = '<i class="fa fa-volume-up"></i>';
            }
            isPlaying = !isPlaying;
        });

        // 平滑滚动
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                document.querySelector(this.getAttribute('href')).scrollIntoView({
                    behavior: 'smooth'
                });
            });
        });

        // 表单提交处理（金山文档版）
        const orderForm = document.getElementById('orderForm');
        const submitBtn = document.getElementById('submitBtn');
        const successMessage = document.getElementById('successMessage');

        // 替换成你的金山文档Webhook地址
        const WPS_WEBHOOK = 'https://www.kdocs.cn/chatflow/api/v2/func/webhook/3ELO5T8ClACpg17UfZJHYIb3qF3';

        orderForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // 禁用提交按钮防止重复提交
            submitBtn.disabled = true;
            submitBtn.innerHTML = '提交中...';

            try {
                // 收集表单数据
                const formData = new FormData(orderForm);
                const data = Object.fromEntries(formData.entries());

                // 发送到金山文档
                const response = await fetch(WPS_WEBHOOK, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    // 提交成功
                    orderForm.classList.add('hidden');
                    successMessage.classList.remove('hidden');
                } else {
                    throw new Error('提交失败');
                }
            } catch (error) {
                alert('订单提交失败，请稍后重试或直接联系我们！');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '提交订单';
            }
        });
    </script>
</body>
</html>
